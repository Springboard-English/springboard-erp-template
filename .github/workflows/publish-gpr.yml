name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@Springboard-English"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Type check
        run: npx tsc

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify consumer repos
        if: success()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || 'latest' }}
        run: |
          # Fail loudly rather than `|| echo`. The previous version swallowed
          # every dispatch error, so an unset DISPATCH_TOKEN reported success
          # while notifying nobody — which is exactly how this went unnoticed.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DISPATCH_TOKEN is not set — consumer repos cannot be notified."
            echo "Set a repo secret DISPATCH_TOKEN (PAT with 'repo' scope) on this repository."
            exit 1
          fi

          failed=""
          for repo in erp-crm erp-hrm lms.springboard.vn; do
            if gh api repos/Springboard-English/$repo/dispatches \
              --method POST \
              -f event_type=template-published \
              -f "client_payload[version]=$VERSION"; then
              echo "Dispatched template-published ($VERSION) to $repo"
            else
              echo "::error::dispatch to $repo failed"
              failed="$failed $repo"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::consumer repos not notified:$failed"
            exit 1
          fi
          done
